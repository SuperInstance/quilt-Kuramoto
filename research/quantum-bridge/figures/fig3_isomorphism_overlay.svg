<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="DejaVu Sans, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-rendering="geometricPrecision">
<rect width="1100" height="560" fill="#FAFAF9"/>

    <defs>
      <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
      </marker>
    </defs>

    <defs>
      <marker id="arr_inv" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
      </marker>
    </defs>
<text x="550" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Figure 3 — The structural isomorphism</text><text x="550" y="60" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">Different mathematics, same epistemic shape. Both produce verifiable outputs from a forward-and-backward comparison.</text><rect x="80" y="90" width="380" height="40" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="270.0" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">QUANTUM — Google OTOC (Oct 2025)</text><rect x="620" y="90" width="380" height="40" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="810.0" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">QUILT — t-minus + ternary-predict</text><text x="40" y="195" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle" transform="rotate(-90, 40, 195)">forward pass</text><rect x="80" y="160" width="380" height="70" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="270.0" y="200" text-anchor="middle" font-size="13" fill="#111827">U  —  unitary evolution of the quantum state</text><rect x="620" y="160" width="380" height="70" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="810.0" y="200" text-anchor="middle" font-size="13" fill="#111827">Predict  —  agent's forward simulation of what will happen</text><line x1="470" y1="195.0" x2="610" y2="195.0" stroke="#059669" stroke-width="2.5" marker-end="url(#arr_inv)"/><text x="540.0" y="187.0" text-anchor="middle" font-size="10" font-style="italic" fill="#059669">↔</text><text x="40" y="277" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle" transform="rotate(-90, 40, 277)">the event</text><rect x="80" y="242" width="380" height="70" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="270.0" y="282" text-anchor="middle" font-size="13" fill="#111827">V  —  perturbation applied at t = 0</text><rect x="620" y="242" width="380" height="70" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="810.0" y="282" text-anchor="middle" font-size="13" fill="#111827">T−  —  countdown event scheduled at t₀</text><line x1="470" y1="277.0" x2="610" y2="277.0" stroke="#059669" stroke-width="2.5" marker-end="url(#arr_inv)"/><text x="540.0" y="269.0" text-anchor="middle" font-size="10" font-style="italic" fill="#059669">↔</text><text x="40" y="359" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle" transform="rotate(-90, 40, 359)">backward pass</text><rect x="80" y="324" width="380" height="70" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="270.0" y="364" text-anchor="middle" font-size="13" fill="#111827">U†  —  reverse unitary (the time-reversal)</text><rect x="620" y="324" width="380" height="70" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="810.0" y="364" text-anchor="middle" font-size="13" fill="#111827">Sensor reads  —  what actually happened (the check)</text><line x1="470" y1="359.0" x2="610" y2="359.0" stroke="#059669" stroke-width="2.5" marker-end="url(#arr_inv)"/><text x="540.0" y="351.0" text-anchor="middle" font-size="10" font-style="italic" fill="#059669">↔</text><text x="40" y="441" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle" transform="rotate(-90, 40, 441)">the measurement</text><rect x="80" y="406" width="380" height="70" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="270.0" y="446" text-anchor="middle" font-size="13" fill="#111827">W  —  second perturbation; an observable</text><rect x="620" y="406" width="380" height="70" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="810.0" y="446" text-anchor="middle" font-size="13" fill="#111827">Prediction comparison  —  the prediction-error signal</text><line x1="470" y1="441.0" x2="610" y2="441.0" stroke="#059669" stroke-width="2.5" marker-end="url(#arr_inv)"/><text x="540.0" y="433.0" text-anchor="middle" font-size="10" font-style="italic" fill="#059669">↔</text><text x="40" y="523" font-size="11" font-style="italic" fill="#6B7280" text-anchor="middle" transform="rotate(-90, 40, 523)">verifiable output</text><rect x="80" y="488" width="380" height="70" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="270.0" y="528" text-anchor="middle" font-size="11" fill="#111827">F(t)  —  expectation value, cross-checkable across devices</text><rect x="620" y="488" width="380" height="70" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="810.0" y="528" text-anchor="middle" font-size="11" fill="#111827">PredictionOutcome + witness entry, cross-checkable across agents</text><line x1="470" y1="523.0" x2="610" y2="523.0" stroke="#059669" stroke-width="2.5" marker-end="url(#arr_inv)"/><text x="540.0" y="515.0" text-anchor="middle" font-size="10" font-style="italic" fill="#059669">↔</text><text x="550" y="600" text-anchor="middle" font-size="12" fill="#111827">The two systems arrive at the same epistemic structure from opposite directions:</text><text x="550" y="620" text-anchor="middle" font-size="12" fill="#111827">quantum hardware <tspan font-style="italic">discovered</tspan> verifiable advantage between 2019 and 2025;</text><text x="550" y="638" text-anchor="middle" font-size="12" fill="#111827">quilt was <tspan font-style="italic">designed around</tspan> sensors-as-confirmations from the first commit.</text></svg>
