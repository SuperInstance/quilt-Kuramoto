<text x="550" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Figure 5 — paper-207: quilt opcodes as quantum-mechanical operations</text><text x="550" y="60" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">The most direct primary-source quantum-mechanics engagement in the corpus. Stated in an essay; not implemented in runtime code.</text><rect x="60" y="90" width="300" height="40" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="210.0" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">QUILT OPCODE</text><rect x="380" y="90" width="360" height="40" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="560.0" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">PAPER-207 FORMALISM</text><rect x="760" y="90" width="300" height="40" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="910.0" y="115" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">QUANTUM-MECH OBJECT</text><rect x="60" y="160" width="300" height="60" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="210.0" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">EFFECT</text><rect x="380" y="160" width="360" height="60" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="560.0" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">U(θ_E) = e^(-i θ_E H_A)</text><rect x="760" y="160" width="300" height="60" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="910.0" y="190" text-anchor="middle" font-size="12" fill="#111827">Unitary evolution under</text><text x="910.0" y="206" text-anchor="middle" font-size="12" fill="#111827">interaction Hamiltonian</text><line x1="365" y1="190.0" x2="375" y2="190.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="745" y1="190.0" x2="755" y2="190.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="60" y="228" width="300" height="60" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="210.0" y="263" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">VIEW</text><rect x="380" y="228" width="360" height="60" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="560.0" y="263" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">P_A(θ_V) |ψ_B⟩</text><rect x="760" y="228" width="300" height="60" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="910.0" y="258" text-anchor="middle" font-size="12" fill="#111827">Projection operator</text><text x="910.0" y="274" text-anchor="middle" font-size="12" fill="#111827">(measurement)</text><line x1="365" y1="258.0" x2="375" y2="258.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="745" y1="258.0" x2="755" y2="258.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="60" y="296" width="300" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="210.0" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">TICK</text><rect x="380" y="296" width="360" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="560.0" y="331" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">e^(-i θ_T H_A) |ψ_A(t)⟩</text><rect x="760" y="296" width="300" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="910.0" y="326" text-anchor="middle" font-size="12" fill="#111827">Schrödinger time evolution</text><text x="910.0" y="342" text-anchor="middle" font-size="12" fill="#111827">(verbatim)</text><line x1="365" y1="326.0" x2="375" y2="326.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="745" y1="326.0" x2="755" y2="326.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="60" y="364" width="300" height="60" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="210.0" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">LINK</text><rect x="380" y="364" width="360" height="60" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="560.0" y="399" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">connection ∇ on fiber bundle</text><rect x="760" y="364" width="300" height="60" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="910.0" y="394" text-anchor="middle" font-size="12" fill="#111827">Gauge connection</text><line x1="365" y1="394.0" x2="375" y2="394.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="745" y1="394.0" x2="755" y2="394.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="60" y="432" width="300" height="60" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="210.0" y="467" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">The Wound</text><rect x="380" y="432" width="360" height="60" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/><text x="560.0" y="467" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Ω = d∇ + ∇ ∧ ∇</text><rect x="760" y="432" width="300" height="60" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="910.0" y="462" text-anchor="middle" font-size="12" fill="#111827">Curvature 2-form</text><line x1="365" y1="462.0" x2="375" y2="462.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="745" y1="462.0" x2="755" y2="462.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="60" y="500" width="300" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="210.0" y="535" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Witness log</text><rect x="380" y="500" width="360" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="560.0" y="535" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Holonomy group element</text><rect x="760" y="500" width="300" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="910.0" y="530" text-anchor="middle" font-size="12" fill="#111827">Wilson loop /</text><text x="910.0" y="546" text-anchor="middle" font-size="12" fill="#111827">Aharonov-Bohm phase</text><line x1="365" y1="530.0" x2="375" y2="530.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><line x1="745" y1="530.0" x2="755" y2="530.0" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/><rect x="60" y="583" width="1000" height="100" rx="6" fill="#FAFAF9" stroke="#374151" stroke-width="1.5"/><text x="70" y="605" font-size="12" font-weight="700" fill="#111827">Honest caveats (per deep-dive scout 4-g):</text><text x="70" y="625" font-size="11" fill="#111827">1. Paper 207 uses real θ ∈ ℝ, not complex phases. Real-valued generalizations of QM cannot reproduce all QM correlations</text><text x="70" y="639" font-size="11" fill="#111827">   (Bell inequality violations require complex amplitudes in standard QM). Closer to a quantum-inspired classical model.</text><text x="70" y="653" font-size="11" fill="#111827">2. Paper 207 is explicit about being "an essay, not a spec." No executable code implements U(θ) = e^(-iθH) in the corpus.</text><text x="70" y="667" font-size="11" fill="#111827">3. The runtime quilt-substrate does NOT compute U(θ) = e^(-iθH). It computes confidence decay + witness-log append.</text><text x="70" y="681" font-size="11" fill="#111827">   The "wave" in "the witness fixes the wave" is a metaphor for the commit/canonical distinction, not a complex-valued wavefunction.</text></svg>
