<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="DejaVu Sans, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-rendering="geometricPrecision">
<rect width="880" height="460" fill="#FAFAF9"/>

    <defs>
      <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
      </marker>
    </defs>
<text x="440" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Figure 2 — Anatomy of a quilt t-minus + ternary-predict cycle</text><text x="440" y="60" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">Predict (forward simulation) → schedule (countdown) → sensor reads → compare → PredictionOutcome + witness log entry</text><line x1="80" y1="280" x2="800" y2="280" stroke="#374151" stroke-width="1.5"/><polygon points="800,280 790,275 790,285" fill="#374151"/><text x="810" y="285" font-size="12" fill="#6B7280" font-style="italic">time →</text><rect x="100" y="245" width="220" height="50" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="210" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">Predict (forward sim)</text><text x="210" y="285" text-anchor="middle" font-size="11" fill="#111827">agent simulates what will happen</text><line x1="320" y1="270" x2="370" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/><rect x="375" y="230" width="80" height="80" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="415" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">T−</text><text x="415" y="285" text-anchor="middle" font-size="10" fill="#111827">schedule</text><text x="415" y="302" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">event fires at t₀</text><line x1="460" y1="270" x2="510" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/><rect x="515" y="245" width="220" height="50" rx="6" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="625" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#C2410C">Sensor reads</text><text x="625" y="285" text-anchor="middle" font-size="11" fill="#111827">what actually happened at t₀</text><rect x="375" y="135" width="80" height="50" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="415" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">read</text><text x="415" y="173" text-anchor="middle" font-size="10" fill="#111827">sensor</text><text x="415" y="187" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">t = t₀</text><rect x="180" y="80" width="480" height="60" rx="6" fill="#FAFAF9" stroke="#374151" stroke-width="1.5"/><text x="420" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">PredictionOutcome = { Confirmed (+1) |</text><text x="420" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">Exceeded (−1) | Within (0) }</text><line x1="375" y1="140" x2="375" y2="135" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/><line x1="415" y1="140" x2="415" y2="230" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/><text x="440" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Why this is structurally aligned with the OTOC (quilt corpus, primary sources):</text><text x="80" y="370" font-size="12" fill="#111827">(i)  predict-and-confirm is the protocol shape — declared future vs. observed present (t-minus README)</text><text x="80" y="392" font-size="12" fill="#111827">(ii) sensor reports surprises, not raw data — only the prediction-error is surfaced (ternary-predict)</text><text x="80" y="414" font-size="12" fill="#111827">(iii) the witness log (Merkle tree) attests every Confirmation — cross-checkable across agents (quilt-substrate)</text><text x="80" y="436" font-size="12" fill="#111827">(iv) convoy consensus (Wilson LB / geometric median) cross-checks across devices — same shape as IBM trusted advantage</text><rect x="710" y="80" width="130" height="60" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="775" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">VERIFIABLE</text><text x="775" y="120" text-anchor="middle" font-size="10" fill="#111827">witness log</text><text x="775" y="134" text-anchor="middle" font-size="10" fill="#111827">+ convoy consensus</text><line x1="710" y1="110" x2="665" y2="110" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/></svg>
