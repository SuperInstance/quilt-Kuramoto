<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460" font-family="DejaVu Sans, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-rendering="geometricPrecision">
<rect width="880" height="460" fill="#FAFAF9"/>

    <defs>
      <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
      </marker>
    </defs>
<text x="440" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Figure 1 — Anatomy of a Google OTOC verifiable-advantage experiment</text><text x="440" y="60" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">Forward evolution U → perturbation V → backward evolution U† → perturbation W → expectation value F(t)</text><line x1="80" y1="280" x2="800" y2="280" stroke="#374151" stroke-width="1.5"/><polygon points="800,280 790,275 790,285" fill="#374151"/><text x="810" y="285" font-size="12" fill="#6B7280" font-style="italic">time →</text><rect x="100" y="245" width="220" height="50" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="210" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">U (forward)</text><text x="210" y="285" text-anchor="middle" font-size="11" fill="#111827">unitary evolution</text><line x1="320" y1="270" x2="370" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/><rect x="375" y="230" width="80" height="80" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="415" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">V</text><text x="415" y="285" text-anchor="middle" font-size="10" fill="#111827">perturbation</text><text x="415" y="302" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">t = 0</text><line x1="460" y1="270" x2="510" y2="270" stroke="#374151" stroke-width="2" marker-end="url(#arr)"/><rect x="515" y="245" width="220" height="50" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="625" y="265" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">U† (backward)</text><text x="625" y="285" text-anchor="middle" font-size="11" fill="#111827">reverse unitary</text><rect x="375" y="135" width="80" height="50" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="415" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">W</text><text x="415" y="173" text-anchor="middle" font-size="10" fill="#111827">perturbation</text><text x="415" y="187" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">t = 0</text><rect x="240" y="80" width="400" height="50" rx="6" fill="#FAFAF9" stroke="#374151" stroke-width="1.5"/><text x="440" y="110" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">F(t) = ⟨ W(t) V(0) V(t) W(0) ⟩</text><line x1="375" y1="130" x2="375" y2="135" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/><line x1="415" y1="130" x2="415" y2="230" stroke="#374151" stroke-width="1" stroke-dasharray="3,3"/><text x="440" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Why this is classically hard (Google, Oct 2025; Aaronson, Jul 2026):</text><text x="80" y="370" font-size="12" fill="#111827">(i)  many-body interference of complex amplitudes — sign problem defeats Quantum Monte Carlo</text><text x="80" y="392" font-size="12" fill="#111827">(ii) quantum chaos — every amplitude equally important; defeats compressed tensor-network reps</text><text x="80" y="414" font-size="12" fill="#111827">(iii) time-reversal structure — slow power-law signal decay (vs. exponential for forward-only)</text><text x="80" y="436" font-size="12" fill="#111827">(iv) verifiability — produces expectation values cross-checkable across quantum devices</text><rect x="710" y="80" width="130" height="50" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="775" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#059669">VERIFIABLE</text><text x="775" y="118" text-anchor="middle" font-size="10" fill="#111827">expectation value</text><text x="775" y="132" text-anchor="middle" font-size="10" fill="#111827">cross-checked</text><line x1="710" y1="105" x2="640" y2="105" stroke="#059669" stroke-width="2" marker-end="url(#arr)"/></svg>
