[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tminus-band"
version = "0.1.0"
description = "Exact integer tolerance bands for predict-and-confirm coordination. Fire on what is known, not on how many said it. Stdlib-only Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SuperInstance", email = "noreply@superinstance.org" }]
keywords = ["exact", "interval", "tolerance", "swarm", "t-minus", "predict-and-confirm", "coordination"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
tminus = ["swarm-tminus>=0.2.2"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/SuperInstance/tminus-band"
Companion = "https://github.com/SuperInstance/exact-band"

[tool.setuptools.packages.find]
include = ["tminus_band*"]
