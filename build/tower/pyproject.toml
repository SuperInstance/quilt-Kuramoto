[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tower-cells"
version = "0.1.0"
description = "Compile a physical-quantity cell spec into exact, float-free C - and refuse to compile it when the units don't work out. Stdlib-only Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SuperInstance", email = "noreply@superinstance.org" }]
keywords = ["codegen", "embedded", "fixed-point", "exact", "sensors", "c99"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Embedded Systems",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
tower = "tower.__main__:main"

[project.urls]
Homepage = "https://github.com/SuperInstance/tower"
Companion = "https://github.com/SuperInstance/exact-band"

[tool.setuptools.packages.find]
include = ["tower*"]
