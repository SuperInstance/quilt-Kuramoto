<text x="550" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Figure 4 — The verifiability convergence</text><text x="550" y="60" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">Both fields arrive at "verifiable expectation values cross-checked across devices." Quantum took 7 years; quilt started there.</text><text x="100" y="130" font-size="14" font-weight="700" fill="#1E40AF">Quantum hardware (2019 → 2026)</text><line x1="120" y1="160" x2="1000" y2="160" stroke="#1E40AF" stroke-width="2"/><polygon points="1000,160 990,154 990,166" fill="#1E40AF"/><circle cx="180" cy="160" r="10" fill="#FECACA" stroke="#991B1B" stroke-width="2"/><text x="180" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2019</text><text x="180" y="74" text-anchor="middle" font-size="10" fill="#111827">Sycamore</text><text x="180" y="88" text-anchor="middle" font-size="10" fill="#111827">RCS</text><text x="180" y="102" text-anchor="middle" font-size="10" fill="#111827">(unverifiable</text><text x="180" y="116" text-anchor="middle" font-size="10" fill="#111827">bitstrings)</text><circle cx="380" cy="160" r="10" fill="#FDE68A" stroke="#92400E" stroke-width="2"/><text x="380" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2023</text><text x="380" y="74" text-anchor="middle" font-size="10" fill="#111827">IBM 'utility'</text><text x="380" y="88" text-anchor="middle" font-size="10" fill="#111827">(kicked Ising;</text><text x="380" y="102" text-anchor="middle" font-size="10" fill="#111827">matched by</text><text x="380" y="116" text-anchor="middle" font-size="10" fill="#111827">Tindall 2024)</text><circle cx="580" cy="160" r="10" fill="#DBEAFE" stroke="#1E40AF" stroke-width="2"/><text x="580" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2024</text><text x="580" y="86" text-anchor="middle" font-size="10" fill="#111827">Google Willow</text><text x="580" y="100" text-anchor="middle" font-size="10" fill="#111827">below-threshold</text><text x="580" y="114" text-anchor="middle" font-size="10" fill="#111827">QEC</text><circle cx="780" cy="160" r="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="780" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2025</text><text x="780" y="86" text-anchor="middle" font-size="10" fill="#111827">Google OTOC</text><text x="780" y="100" text-anchor="middle" font-size="10" fill="#111827">'verifiable</text><text x="780" y="114" text-anchor="middle" font-size="10" fill="#111827">advantage'</text><circle cx="950" cy="160" r="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="950" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2026</text><text x="950" y="86" text-anchor="middle" font-size="10" fill="#111827">IBM/Qedma</text><text x="950" y="100" text-anchor="middle" font-size="10" fill="#111827">'trusted</text><text x="950" y="114" text-anchor="middle" font-size="10" fill="#111827">advantage'</text><text x="100" y="290" font-size="14" font-weight="700" fill="#C2410C">Quilt (designed from first commit)</text><line x1="120" y1="320" x2="1000" y2="320" stroke="#C2410C" stroke-width="2"/><polygon points="1000,320 990,314 990,326" fill="#C2410C"/><rect x="160" y="305" width="820" height="30" fill="#D1FAE5" stroke="#059669" stroke-width="1.5" opacity="0.7"/><text x="570" y="325" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">PredictionOutcome (Confirmed / Exceeded / Within) + witness log + convoy consensus — from first commit</text><circle cx="200" cy="320" r="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="200" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2024-12</text><circle cx="950" cy="320" r="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/><text x="950" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">2026-09</text><line x1="780" y1="195" x2="780" y2="295" stroke="#059669" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arr_inv)"/><line x1="950" y1="195" x2="950" y2="295" stroke="#059669" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arr_inv)"/><text x="550" y="430" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">The fields converge.</text><text x="550" y="452" text-anchor="middle" font-size="11" fill="#111827">Quantum discovered verifiability as the methodologically-defensible frame (Google OTOC, IBM trusted advantage).</text><text x="550" y="470" text-anchor="middle" font-size="11" fill="#111827">Quilt was built around it from the start (sensors-as-confirmations; witness log; convoy consensus).</text></svg>
