<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="DejaVu Sans, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" text-rendering="geometricPrecision">
<rect width="1100" height="700" fill="#FAFAF9"/>

    <defs>
      <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
      </marker>
    </defs>

    <defs>
      <marker id="arr_inv" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
      </marker>
    </defs>
<text x="550" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Figure 7 — The three positions in the Aaronson–Hagar–Quilt debate</text><text x="550" y="60" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">Quilt occupies a third position neither side has articulated: verifiable advantage is real AND the substrate may not matter as much as the structural invariants.</text><rect x="350" y="100" width="400" height="60" rx="6" fill="#FAFAF9" stroke="#374151" stroke-width="1.5"/><text x="550" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">SHARED ASSUMPTIONS (Aaronson + Hagar)</text><text x="550" y="145" text-anchor="middle" font-size="11" fill="#111827">1. The substrate matters (quantum vs classical)</text><text x="550" y="160" text-anchor="middle" font-size="11" fill="#111827">2. The complexity class is the relevant metric (BQP vs P)</text><text x="550" y="175" text-anchor="middle" font-size="11" fill="#111827">3. The output is the thing being verified</text><rect x="60" y="180" width="280" height="180" rx="6" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="2"/><text x="200" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#1E40AF">AARONSON</text><text x="200" y="225" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">"NISQ did not fail" (Jul 18 2026)</text><text x="80" y="255" font-size="11" fill="#111827">Verifiable advantage is REAL.</text><text x="80" y="275" font-size="11" fill="#111827">Four current candidates:</text><text x="80" y="295" font-size="11" fill="#111827">• Google OTOC (interference +</text><text x="80" y="310" font-size="11" fill="#111827">  chaos + time-reversal)</text><text x="80" y="330" font-size="11" fill="#111827">• Quantinuum H2 (gate fidelity)</text><text x="80" y="350" font-size="11" fill="#111827">• IBM/Qedma Floquet dynamics</text><text x="80" y="370" font-size="11" fill="#111827">• 2D Fermi-Hubbard</text><text x="80" y="395" font-size="11" font-style="italic" fill="#111827">Each has a specific structural</text><text x="80" y="410" font-size="11" font-style="italic" fill="#111827">reason for classical hardness.</text><rect x="760" y="180" width="280" height="180" rx="6" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/><text x="900" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#7C3AED">HAGAR</text><text x="900" y="225" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">"The NISQ Trap" (arXiv:2607.07530, Jul 8 2026)</text><text x="780" y="255" font-size="11" fill="#111827">The NISQ empirically-accessible</text><text x="780" y="275" font-size="11" fill="#111827">region IS classically simulable.</text><text x="780" y="300" font-size="11" fill="#111827">Pattern: within ~18 months of a</text><text x="780" y="315" font-size="11" fill="#111827">major NISQ claim, a classical</text><text x="780" y="330" font-size="11" fill="#111827">algorithm matches it.</text><text x="780" y="355" font-size="11" fill="#111827">Six theoretical results (2024-26)</text><text x="780" y="370" font-size="11" fill="#111827">explain why: Aharonov 2022,</text><text x="780" y="385" font-size="11" fill="#111827">Schuster 2025, Lee 2025, Tindall</text><text x="780" y="400" font-size="11" fill="#111827">2024, Oh 2024, Flatiron May 2026.</text><text x="780" y="420" font-size="11" font-style="italic" fill="#111827">The substrate matters more than</text><text x="780" y="435" font-size="11" font-style="italic" fill="#111827">the invariants.</text><rect x="200" y="480" width="700" height="180" rx="6" fill="#D1FAE5" stroke="#059669" stroke-width="2.5"/><text x="550" y="505" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">QUILT — THE THIRD POSITION</text><text x="550" y="525" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">Empirical evidence (not proof) that the verifiability regime is substrate-independent</text><text x="220" y="555" font-size="12" font-weight="700" fill="#111827">With Aaronson:</text><text x="220" y="575" font-size="11" fill="#111827">Verifiable advantage is REAL. The four candidates are real.</text><text x="220" y="590" font-size="11" fill="#111827">The structural reasons for hardness are real.</text><text x="220" y="620" font-size="12" font-weight="700" fill="#111827">Beyond Hagar:</text><text x="220" y="640" font-size="11" fill="#111827">The substrate may NOT matter as much as the structural invariants —</text><text x="220" y="655" font-size="11" fill="#111827">because the invariants are reachable through DIFFERENT mathematics.</text><text x="600" y="555" font-size="12" font-weight="700" fill="#111827">The 10 structural bridges:</text><text x="600" y="575" font-size="10" fill="#111827">1. Verifiability (sensors-as-confirmations)</text><text x="600" y="591" font-size="10" fill="#111827">2. Schrödinger pattern (paper-207 QM formalism)</text><text x="600" y="607" font-size="10" fill="#111827">3. Mutual subjective simulation ↔ entanglement</text><text x="600" y="623" font-size="10" fill="#111827">4. Predict-and-confirm ↔ OTOC time-reversal</text><text x="600" y="639" font-size="10" fill="#111827">5. Fog-of-war inversion (builds WITH decoherence)</text><text x="880" y="575" font-size="10" fill="#111827">6. Noncommutative geometry (asserted, not impl.)</text><text x="880" y="591" font-size="10" fill="#111827">7. Monotone Crystal / Dedekind asymptotic</text><text x="880" y="607" font-size="10" fill="#111827">8. Meta-epistemic self-correction discipline</text><text x="880" y="623" font-size="10" fill="#111827">9. NEW: Adjoint-inference / dual-additivity</text><text x="880" y="639" font-size="10" fill="#111827">10. NEW: Impossibility-floor as no-signaling analog</text><line x1="200" y1="360" x2="350" y2="480" stroke="#059669" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arr_inv)"/><text x="220" y="395" font-size="10" font-style="italic" fill="#059669">agrees on</text><text x="220" y="408" font-size="10" font-style="italic" fill="#059669">verifiable advantage</text><line x1="900" y1="360" x2="750" y2="480" stroke="#059669" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arr_inv)"/><text x="820" y="395" font-size="10" font-style="italic" fill="#059669">extends the</text><text x="820" y="408" font-size="10" font-style="italic" fill="#059669">substrate-doesnt-matter direction</text><text x="550" y="685" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Quilt does not refute either position. It offers a different contribution to the conceptual space the debate opens.</text></svg>
