<text x="700" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Figure 9 — Top-Down: Physical Accomplishment → Mechanical Switch at the Metal</text><text x="700" y="60" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">5 use cases × 7 layers: from a fish caught / a game played / a circuit synthesized → down to the transistor</text><rect x="60" y="85" width="200" height="45" rx="5" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="160" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">PHYSICAL</text><text x="160" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">ACCOMPLISHMENT</text><rect x="270" y="85" width="180" height="45" rx="5" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="360" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">APPLICATION</text><rect x="460" y="85" width="170" height="45" rx="5" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="545" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">COORDINATION</text><rect x="640" y="85" width="170" height="45" rx="5" fill="#FED7AA" stroke="#9A3412" stroke-width="1.5"/><text x="725" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">CELL</text><rect x="820" y="85" width="170" height="45" rx="5" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/><text x="905" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">SUBSTRATE</text><text x="905" y="119" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">(5+1 opcodes)</text><rect x="1000" y="85" width="180" height="45" rx="5" fill="#DBEAFE" stroke="#1E3A8A" stroke-width="1.5"/><text x="1090" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">HARDWARE</text><rect x="1200" y="85" width="180" height="45" rx="5" fill="#F3F4F6" stroke="#374151" stroke-width="1.5"/><text x="1290" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#111827">METAL</text><rect x="60" y="145" width="200" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="160" y="175" text-anchor="middle" font-size="11" fill="#111827">Boat catches fish</text><text x="160" y="193" text-anchor="middle" font-size="11" fill="#111827">(EILEEN, Kodiak)</text><rect x="270" y="145" width="180" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="360" y="175" text-anchor="middle" font-size="11" fill="#111827">NMEA parse</text><text x="360" y="193" text-anchor="middle" font-size="11" fill="#111827">115200 baud</text><rect x="460" y="145" width="170" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="545" y="175" text-anchor="middle" font-size="11" fill="#111827">Vessel limb</text><text x="545" y="193" text-anchor="middle" font-size="11" fill="#111827">(predict day)</text><rect x="640" y="145" width="170" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="725" y="175" text-anchor="middle" font-size="11" fill="#111827">10-cell</text><text x="725" y="193" text-anchor="middle" font-size="11" fill="#111827">vessel</text><rect x="820" y="145" width="170" height="130" rx="5" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/><text x="905" y="175" text-anchor="middle" font-size="11" fill="#111827">5 opcodes</text><text x="905" y="193" text-anchor="middle" font-size="11" fill="#111827">(C VM)</text><rect x="1000" y="145" width="180" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="1090" y="175" text-anchor="middle" font-size="11" fill="#111827">ESP32-S3</text><text x="1090" y="193" text-anchor="middle" font-size="11" fill="#111827">240 MHz</text><rect x="1200" y="145" width="180" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="1290" y="175" text-anchor="middle" font-size="11" fill="#111827">6T SRAM</text><text x="1290" y="193" text-anchor="middle" font-size="11" fill="#111827">400 transistors</text><text x="1290" y="211" text-anchor="middle" font-size="11" fill="#111827">per BIND</text><line x1="263" y1="210" x2="267" y2="210" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="453" y1="210" x2="457" y2="210" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="633" y1="210" x2="637" y2="210" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="813" y1="210" x2="817" y2="210" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="993" y1="210" x2="997" y2="210" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="1183" y1="210" x2="1197" y2="210" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><rect x="60" y="283" width="200" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="160" y="313" text-anchor="middle" font-size="11" fill="#111827">Oil pressure</text><text x="160" y="331" text-anchor="middle" font-size="11" fill="#111827">monitored (60 psi)</text><rect x="270" y="283" width="180" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="360" y="313" text-anchor="middle" font-size="11" fill="#111827">ADC → mV → psi</text><text x="360" y="331" text-anchor="middle" font-size="11" fill="#111827">12-bit, 100ms</text><rect x="460" y="283" width="170" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="545" y="313" text-anchor="middle" font-size="11" fill="#111827">Twin-posting</text><text x="545" y="331" text-anchor="middle" font-size="11" fill="#111827">(snap_debt)</text><rect x="640" y="283" width="170" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="725" y="313" text-anchor="middle" font-size="11" fill="#111827">1 cell</text><text x="725" y="331" text-anchor="middle" font-size="11" fill="#111827">+ ledger</text><rect x="820" y="283" width="170" height="130" rx="5" fill="#D1FAE5" st