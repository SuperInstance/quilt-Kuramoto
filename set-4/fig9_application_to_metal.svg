-anchor="middle" font-size="11" fill="#111827">micro-units</text><rect x="460" y="421" width="170" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="545" y="451" text-anchor="middle" font-size="11" fill="#111827">Critic's</text><text x="545" y="469" text-anchor="middle" font-size="11" fill="#111827">verdict</text><rect x="640" y="421" width="170" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="725" y="451" text-anchor="middle" font-size="11" fill="#111827">1 cell</text><text x="725" y="469" text-anchor="middle" font-size="11" fill="#111827">gate</text><rect x="820" y="421" width="170" height="130" rx="5" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/><text x="905" y="451" text-anchor="middle" font-size="11" fill="#111827">Integer</text><text x="905" y="469" text-anchor="middle" font-size="11" fill="#111827">judge</text><rect x="1000" y="421" width="180" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="1090" y="451" text-anchor="middle" font-size="11" fill="#111827">ESP32-S3</text><text x="1090" y="469" text-anchor="middle" font-size="11" fill="#111827">radio-dark</text><rect x="1200" y="421" width="180" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="1290" y="451" text-anchor="middle" font-size="11" fill="#111827">Integer ALU</text><text x="1290" y="469" text-anchor="middle" font-size="11" fill="#111827">24 cycles</text><text x="1290" y="487" text-anchor="middle" font-size="11" fill="#111827">100ns</text><line x1="263" y1="486" x2="267" y2="486" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="453" y1="486" x2="457" y2="486" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="633" y1="486" x2="637" y2="486" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="813" y1="486" x2="817" y2="486" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="993" y1="486" x2="997" y2="486" 