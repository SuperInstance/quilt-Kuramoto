text><rect x="820" y="697" width="170" height="130" rx="5" fill="#D1FAE5" stroke="#059669" stroke-width="1.2"/><text x="905" y="727" text-anchor="middle" font-size="11" fill="#111827">5 opcodes</text><text x="905" y="745" text-anchor="middle" font-size="11" fill="#111827">as RTL</text><rect x="1000" y="697" width="180" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="1090" y="727" text-anchor="middle" font-size="11" fill="#111827">iCE40 HX8K</text><text x="1090" y="745" text-anchor="middle" font-size="11" fill="#111827">98% LC</text><rect x="1200" y="697" width="180" height="130" rx="5" fill="#FFFFFF" stroke="#374151" stroke-width="1.2"/><text x="1290" y="727" text-anchor="middle" font-size="11" fill="#111827">LUT4 SRAM</text><text x="1290" y="745" text-anchor="middle" font-size="11" fill="#111827">96 transistors</text><text x="1290" y="763" text-anchor="middle" font-size="11" fill="#111827">633K total</text><line x1="263" y1="762" x2="267" y2="762" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="453" y1="762" x2="457" y2="762" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="633" y1="762" x2="637" y2="762" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="813" y1="762" x2="817" y2="762" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="993" y1="762" x2="997" y2="762" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><line x1="1183" y1="762" x2="1197" y2="762" stroke="#374151" stroke-width="1" marker-end="url(#a2)"/><defs><marker id="a2" markerWidth="6" markerHeight="6" refX="5" refY="2" orient="auto"><path d="M0,0 L0,4 L5,2 z" fill="#374151"/></marker></defs><text x="700" y="855" text-anchor="middle" font-size="12" font-weight="700" fill="#111827">Every use case traces from a physical accomplishment to a mechanical switch at the metal.</text><text x="700" y="873" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">The chain is unbroken: fish → NMEA → cell → opcode → SRAM → transistor. Each layer maps to the next.</text></svg>
